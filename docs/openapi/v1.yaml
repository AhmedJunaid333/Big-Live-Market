openapi: 3.1.0
info:
  title: Big Live Marketplace REST API
  description: Comprehensive REST API specification for Big Live Marketplace platform (Web, Android, iOS).
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns service status, version, and server timestamp.
      responses:
        '200':
          description: Service is healthy

  /auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                phone_e164: { type: string }
                locale: { type: string, enum: [en, ur] }
                preferred_currency: { type: string, example: PKR }
      responses:
        '201':
          description: User registered successfully

  /auth/login:
    post:
      summary: Authenticate user and issue Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email: { type: string }
                phone_e164: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in successfully

  /auth/logout:
    post:
      summary: Revoke current access token
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Token revoked

  /auth/logout-all:
    post:
      summary: Revoke all access tokens across all devices
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: All tokens revoked

  /auth/otp/send:
    post:
      summary: Request an OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, purpose]
              properties:
                destination: { type: string }
                purpose: { type: string, enum: [phone_verification, login, password_reset] }
      responses:
        '200':
          description: OTP dispatched

  /auth/otp/verify:
    post:
      summary: Verify an OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, code, purpose]
              properties:
                destination: { type: string }
                code: { type: string }
                purpose: { type: string }
      responses:
        '200':
          description: Code verified successfully

  /me:
    get:
      summary: Get authenticated profile
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: User profile details
    patch:
      summary: Update user profile
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Profile updated
    delete:
      summary: Soft delete account per data retention policy
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Account deleted

  /countries:
    get:
      summary: List supported countries
      responses:
        '200':
          description: List of countries

  /regions:
    get:
      summary: List regions / provinces
      parameters:
        - name: country_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: List of regions

  /cities:
    get:
      summary: List cities
      parameters:
        - name: region_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: List of cities

  /categories:
    get:
      summary: Hierarchical category tree
      responses:
        '200':
          description: Category taxonomy tree

  /categories/{slug}:
    get:
      summary: Category details with attributes and brands
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category details

  /categories/{id}/attributes:
    get:
      summary: List dynamic attributes for category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of category attributes

  /listings:
    get:
      summary: List public active listings with cursor pagination
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: city_id
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Collection of active listings
    post:
      summary: Create new listing draft
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Listing draft created

  /listings/{id}:
    get:
      summary: Show listing details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Listing details

  /search:
    get:
      summary: Advanced faceted search with sorting and price filters
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: price_min
          in: query
          schema: { type: integer }
        - name: price_max
          in: query
          schema: { type: integer }
        - name: condition_code
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc] }
      responses:
        '200':
          description: Search results

  /search/suggestions:
    get:
      summary: Autocomplete search suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of suggestions

  /search/map:
    get:
      summary: Geo-location map discovery with privacy rounding
      responses:
        '200':
          description: List of map pins

  /favorites:
    get:
      summary: Get user saved favorites
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: List of favorite listings

  /conversations:
    get:
      summary: List active chat conversations
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: User conversations
    post:
      summary: Start new chat conversation on a listing
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Conversation created

  /conversations/{id}/messages:
    get:
      summary: Get conversation messages
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Message thread
    post:
      summary: Send message in thread
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Message sent

  /conversations/{id}/offers:
    post:
      summary: Make formal price offer on listing
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Offer submitted

  /plans:
    get:
      summary: List subscription packages for business sellers
      responses:
        '200':
          description: Available plans

  /promotion-products:
    get:
      summary: List featured and bump promotion options
      responses:
        '200':
          description: Promotion catalog

  /promotions/checkout:
    post:
      summary: Initiate checkout for listing promotion
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: Order created with idempotency

  /payments/{provider}/webhook:
    post:
      summary: Process signed payment provider webhook
      responses:
        '200':
          description: Webhook processed

  /admin/dashboard:
    get:
      summary: Platform metrics and analytics dashboard
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Metrics summary

  /admin/listings/review:
    get:
      summary: Moderation review queue for listings
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Queue of pending listings

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

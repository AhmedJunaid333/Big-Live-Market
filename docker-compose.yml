services:
  mysql:
    image: mysql:8.0
    container_name: biglive_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: big_live_marketplace
      MYSQL_USER: biglive
      MYSQL_PASSWORD: biglive_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - biglive_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: biglive_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - biglive_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: biglive_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web Dashboard
    networks:
      - biglive_network

networks:
  biglive_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

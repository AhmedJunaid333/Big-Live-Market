name: Sponsored earnings security tests

on:
  push:
    branches:
      - fix/auth-and-real-listings-20261115
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sponsored-earnings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl
          coverage: none
      - name: Validate Composer dependencies
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure test application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run four sponsored earnings security tests
        run: php artisan test --filter=SponsoredEarningSecurityTest

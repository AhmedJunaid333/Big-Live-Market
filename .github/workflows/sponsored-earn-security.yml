name: Sponsored earnings security tests

on:
  push:
    branches:
      - fix/auth-and-real-listings-20261115
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sponsored-earnings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl
          coverage: none
      - name: Validate Composer dependencies
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure test application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check PHP syntax of earning controllers and tests
        run: |
          php -l app/Http/Controllers/Api/SponsoredEarnController.php
          php -l app/Http/Controllers/Api/SponsoredEarnAdminController.php
          php -l tests/Feature/SponsoredEarningSecurityTest.php
          php artisan route:list --path=api/v1/earn
      - name: Run four sponsored earnings security tests
        run: php artisan test --filter=SponsoredEarningSecurityTest --display-errors --display-warnings --testdox
      - name: Save test diagnostics
        if: always()
        run: |
          php -v > sponsored-earn-diagnostics.txt
          php artisan about --only=environment >> sponsored-earn-diagnostics.txt 2>&1 || true
          php artisan test --filter=SponsoredEarningSecurityTest --testdox >> sponsored-earn-diagnostics.txt 2>&1 || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsored-earn-diagnostics
          path: backend/sponsored-earn-diagnostics.txt

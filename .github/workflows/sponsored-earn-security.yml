name: Sponsored earnings security tests

on:
  push:
    branches:
      - fix/auth-and-real-listings-20261115
      - fix/earn-audit-security-20261115
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sponsored-earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl, bcmath
          coverage: none
      - name: Run setup and tests with persistent diagnostics
        id: tests
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== PHP environment =="
            php -v
            echo "== Composer validation =="
            composer validate --no-check-publish
            echo "== Install dependencies =="
            composer install --no-interaction --prefer-dist --no-progress
            echo "== Configure Laravel =="
            cp .env.example .env
            php artisan key:generate
            echo "== PHP syntax =="
            php -l app/Http/Controllers/Api/SponsoredEarnController.php
            php -l app/Http/Controllers/Api/SponsoredEarnAdminController.php
            php -l tests/Feature/SponsoredEarningSecurityTest.php
            echo "== API routes =="
            php artisan route:list --path=api/v1/earn
            echo "== Four sponsored earning security tests =="
            php artisan test --filter=SponsoredEarningSecurityTest --testdox
          } 2>&1 | tee sponsored-earn-diagnostics.txt
      - name: Publish diagnostics in run summary
        if: always()
        shell: bash
        run: |
          if [ -f sponsored-earn-diagnostics.txt ]; then
            echo '## Sponsored earnings diagnostics' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 sponsored-earn-diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Diagnostics file absent: setup did not reach the test shell step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsored-earn-diagnostics
          path: backend/sponsored-earn-diagnostics.txt
          if-no-files-found: warn
